name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # A production build refuses to run without a backend (see
      # assertConfigured in src/lib/config.ts). These placeholders exercise the
      # real code path without pointing at a live project.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, which is what writes package-lock.json locally.
      # npm 10 reads that lockfile as incomplete — it wants @emnapi/* entries
      # that npm 11 resolves differently — and `npm ci` refuses to install.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kept in step with the checks job above; see the note there.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration to a throwaway local Postgres, then runs the
      # pgTAP suites that prove the RLS rules actually hold.
      - name: Start Supabase
        run: supabase start

      - name: Database tests
        run: supabase test db
